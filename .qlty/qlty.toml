# Qlty project configuration for Code Conductor.
# Reference: https://docs.qlty.sh/cli/qlty-toml
# Normally generated by `qlty init`; this hand-authored version is scoped to
# what works in this repo today (no ESLint/Prettier config exists yet).

config_version = "0"

exclude_patterns = [
  "**/node_modules/**",
  "**/dist/**",
  "apm_modules/**",
  "packages/policy/defaults/**",
  "apps/vscode/defaults/**",
  "apps/vscode/schema/**",
  "**/*.tsbuildinfo",
  "release/**",
]

test_patterns = [
  "tests/**",
  "**/*.test.ts",
]

[[source]]
name = "default"
default = true

# Security and supply chain
[[plugin]]
name = "trufflehog"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "trivy"

# Workflow and config hygiene
[[plugin]]
name = "actionlint"

[[plugin]]
name = "yamllint"

[[plugin]]
name = "markdownlint"

[[plugin]]
name = "shellcheck"

# Leaves TODO/FIXME markers visible in the dashboard
[[plugin]]
name = "ripgrep"

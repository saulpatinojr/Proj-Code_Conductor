name: APM audit

# Runs for every pull request, so it can be a required check: a path-filtered required
# check never reports for other changes and leaves the pull request pending.
on:
  pull_request:
  push:
    branches:
      - main
      - 'bootstrap/**'
      - 'feature/**'
      - 'fix/**'
      - 'docs/**'
      - 'chore/**'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: microsoft/apm-action@d723bb64ed70c135bbaf87d126b721dd2dae0439 # v1.10.0
        with:
          apm-version: '0.33.0'
          setup-only: true
      - name: Verify committed APM package, lockfile, policy, projections, and drift
        run: apm audit --ci --policy ./apm-policy.yml --no-fail-fast

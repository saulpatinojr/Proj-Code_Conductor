name: Release

# Builds, tests and attests a release candidate from a version tag on main, and drafts a
# GitHub release for a person to review and publish. Nothing is published to the
# Marketplace here; see docs/RELEASE.md. Each job holds only the access it needs: the
# build, which runs dependency code, cannot sign; the signer runs no repository code; and
# the draft job checks the signature before it writes anything.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # No dependency cache: a release build restores nothing another workflow saved.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check the tag, its commit and the publisher
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          VSCE_PUBLISHER: ${{ vars.VSCE_PUBLISHER }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/vscode/package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match the extension version $version in apps/vscode/package.json."
            exit 1
          fi
          # The full ref name: a tag called origin/main would otherwise win over the branch.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::$TAG is not on main. Release only commits that were reviewed and merged."
            exit 1
          fi
          if [ -z "$VSCE_PUBLISHER" ]; then
            echo "::error::Set the VSCE_PUBLISHER repository variable to the Marketplace publisher ID (docs/RELEASE.md)."
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: node packages/cli/dist/index.js validate .
      - name: Package the extension
        run: npm run package:vscode
        env:
          VSCE_PUBLISHER: ${{ vars.VSCE_PUBLISHER }}
      - name: Install the package outside the checkout and run it against an unrelated folder
        shell: bash
        run: |
          set -euo pipefail
          install="$RUNNER_TEMP/vsix-install"
          mkdir -p "$install"
          unzip -q release/code-conductor-*.vsix -d "$install"
          node scripts/smoke-vscode-bundle.mjs --extension "$install/extension"
      - name: Write the SBOM, checksums and release notes
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release-candidate"
          mkdir -p "$out"
          cp release/code-conductor-*.vsix "$out/"
          node scripts/release-sbom.mjs "$out/code-conductor-${TAG#v}.cdx.json"
          cd "$out"
          sha256sum code-conductor-* > SHA256SUMS
          {
            echo "Release candidate for $TAG, built and tested from $GITHUB_SHA by the Release workflow."
            echo
            echo 'Verify before installing (docs/RELEASE.md):'
            echo
            echo '```sh'
            echo 'sha256sum -c SHA256SUMS'
            echo "gh attestation verify code-conductor-${TAG#v}.vsix --repo $REPOSITORY \\"
            echo "  --signer-workflow $REPOSITORY/.github/workflows/release.yml \\"
            echo "  --source-ref refs/tags/$TAG --source-digest $GITHUB_SHA --deny-self-hosted-runners"
            echo '```'
          } > NOTES.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ github.ref_name }}
          path: ${{ runner.temp }}/release-candidate/
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Attest build provenance
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Sigstore signing certificate for the provenance attestation
      attestations: write # stores the attestation with this repository
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-${{ github.ref_name }}
          path: candidate
      - name: Check the candidate is complete
        working-directory: candidate
        run: sha256sum -c SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            candidate/code-conductor-*.vsix
            candidate/code-conductor-*.cdx.json

  draft:
    name: Draft GitHub release
    needs: attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # creates the draft release; the job runs no repository or dependency code
      attestations: read # verifies the attestation before drafting
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-${{ github.ref_name }}
          path: candidate
      - name: Verify the candidate and draft the release
        shell: bash
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          # A draft attaches to wherever the tag points when it is published, so the tag
          # must still name the commit that was built and attested.
          read -r type tagged < <(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '"\(.object.type) \(.object.sha)"')
          # An annotated tag points at a tag object; follow it to the commit.
          while [ "$type" = tag ]; do
            read -r type tagged < <(gh api "repos/$GH_REPO/git/tags/$tagged" --jq '"\(.object.type) \(.object.sha)"')
          done
          if [ "$type" != commit ] || [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG now points at $type $tagged, not the built commit $GITHUB_SHA."
            exit 1
          fi
          for file in code-conductor-*; do
            gh attestation verify "$file" --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
              --source-ref "refs/tags/$TAG" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          done
          gh release create "$TAG" --draft --verify-tag --title "Code Conductor $TAG" --notes-file NOTES.md code-conductor-* SHA256SUMS

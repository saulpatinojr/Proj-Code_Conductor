# Code scanning, advanced CodeQL setup for Code Conductor.
#
# Analyzes first-party JavaScript/TypeScript and GitHub Actions workflows.
# Excludes generated agent projections and cache directories via .github/codeql/codeql-config.yml.

name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, so newly published queries find existing code
    - cron: '31 4 * * 1'

permissions:
  contents: read

concurrency:
  # A newer push to a pull request cancels that pull request's superseded run.
  # Every other event (each push to main, the scheduled run) gets a group of
  # its own, so no commit on main is left unanalyzed: by default a shared group
  # holds one pending run and cancels it when the next one queues, whatever
  # cancel-in-progress says.
  group: codeql-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    # Every language is analyzed on every pull request. Code scanning compares each
    # analysis category with the base branch's, so a category skipped on a pull request
    # leaves its CodeQL check neutral ("configuration not found") and the pull request
    # without a comparison for that language.
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4c0873ef8656cb3c50b3f42fb63bc1ade0cfa827 # v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@4c0873ef8656cb3c50b3f42fb63bc1ade0cfa827 # v4
        with:
          category: /language:${{ matrix.language }}

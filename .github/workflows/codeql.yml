# Code scanning, advanced CodeQL setup for Code Conductor.
#
# Analyzes first-party JavaScript/TypeScript and GitHub Actions workflows.
# Excludes generated agent projections and cache directories via .github/codeql/codeql-config.yml.

name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, so newly published queries find existing code
    - cron: '31 4 * * 1'

permissions:
  contents: read

concurrency:
  # A newer push to a pull request cancels that pull request's superseded run.
  # Every other event (each push to main, the schedule, a manual run) gets a
  # group of its own, so no commit on main is left unanalyzed: a shared group
  # holds one pending run and cancels it when the next one queues, whatever
  # cancel-in-progress says.
  group: codeql-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            filter: '\.(js|jsx|ts|tsx|mjs|cjs)$'
          - language: actions
            filter: '^\.github/(workflows|actions)/'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect language changes
        id: changes
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "non-pull_request event — analysing everything"
            exit 0
          fi
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)" || {
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "could not compute the diff — analysing rather than guessing"
            exit 0
          }
          if grep -qE '${{ matrix.filter }}|^\.github/workflows/codeql\.yml$|^\.github/codeql/' <<<"$changed"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.language }} files changed — analysing"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "no ${{ matrix.language }} change — skipping analysis, still reporting this context"
          fi

      - name: Initialize CodeQL
        if: steps.changes.outputs.relevant == 'true'
        uses: github/codeql-action/init@4c0873ef8656cb3c50b3f42fb63bc1ade0cfa827 # v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-and-quality

      - name: Perform CodeQL analysis
        if: steps.changes.outputs.relevant == 'true'
        uses: github/codeql-action/analyze@4c0873ef8656cb3c50b3f42fb63bc1ade0cfa827 # v4
        with:
          category: /language:${{ matrix.language }}

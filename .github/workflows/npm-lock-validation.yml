name: npm lockfile validation

# Runs for every pull request, so it can be a required check (see apm-audit.yml).
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify lockfile is reproducible
        run: npm ci --ignore-scripts
      - name: Verify package metadata did not drift
        shell: bash
        run: |
          cp package-lock.json /tmp/package-lock.before.json
          npm install --package-lock-only --ignore-scripts
          cmp --silent package-lock.json /tmp/package-lock.before.json || {
            echo "::error::package-lock.json is out of date. Run npm install --package-lock-only --ignore-scripts and commit the result."
            exit 1
          }

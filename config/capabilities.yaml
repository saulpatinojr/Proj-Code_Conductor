version: 2

defaults:
  billing_policy: subscription_first
  allow_separately_billed_api: false
  require_official_client_or_api: true

# Deterministic routing hints are intentionally small and inspectable. Explicit
# TaskEnvelope.specializations take precedence over objective-derived hints.
routing:
  objective_signals:
    specification_planning: [requirements, specification, spec, design plan, task plan, architecture plan]
    aws: [aws, amazon web services, cloudformation, aws cdk, lambda, eks, ecs]
    gcp: [gcp, google cloud, vertex ai, cloud run, gke, firebase]
    large_codebase_refactor: [large codebase, refactor, refactoring, legacy migration, codebase migration]
    debugging_testing: [debug, debugging, failing test, failing tests, test failure, test failures, fix tests]
    github_governance: [pull request, pr review, code review, github actions, workflow failure, branch protection]
    external_research: [research, compare vendors, vendor comparison, current options, latest documentation]

harnesses:
  copilot-github:
    provider: github
    auth_boundary: github
    sign_in:
      command: [gh, auth, login]
      instructions: Sign in with the official GitHub CLI; Copilot in VS Code uses the VS Code GitHub account.
      docs: https://cli.github.com/manual/gh_auth_login
    subscription: copilot-pro-plus
    command_candidates: [gh]
    strengths: [github_native_pr_review, github_repository_context, github_actions_context, pull_request_quality_gate]
    primary_specializations: [github_governance]
    preferred_execution_surface: platform
    surfaces:
      ide:
        kind: vscode_extension
        identifiers: [github.copilot, github.copilot-chat, github.vscode-pull-request-github]
        interactive: true
        machine_execution: false
        requires_local_client: false
      platform:
        kind: platform
        interactive: true
        machine_execution: false
        requires_local_client: false
    native_capabilities: [pull_request_review, rereview, actions_context, repository_context, merge_context]

  claude:
    provider: anthropic
    auth_boundary: claude-code
    sign_in:
      command: [claude]
      instructions: Run claude; the first launch opens Anthropic's browser sign-in (use /login inside Claude Code to switch accounts). Use your Claude subscription, not an API key, for subscription-first billing.
      docs: https://code.claude.com/docs/en/authentication
    subscription: claude-max
    command_candidates: [claude]
    strengths: [implementation, refactoring, codebase_reasoning, independent_review]
    primary_specializations: [large_codebase_refactor]
    preferred_execution_surface: cli
    surfaces:
      ide:
        kind: vscode_extension
        identifiers: [anthropic.claude-code]
        interactive: true
        machine_execution: false
        requires_local_client: false
      cli:
        kind: cli
        commands: [claude]
        interactive: true
        machine_execution: true
        requires_local_client: true
        workstation_smoke_required: true
      mcp:
        kind: mcp_client
        interactive: true
        machine_execution: false
        requires_local_client: false
    native_capabilities: [subagents, skills, hooks, commands, plugins, mcp, permissions, sessions, ide_context]
    safety:
      read_mode: permission-mode-plan
      modify_mode: permission-mode-acceptEdits-plus-worktree
      workstation_smoke_required: true

  codex:
    provider: openai
    auth_boundary: codex
    sign_in:
      command: [codex, login]
      instructions: Sign in with ChatGPT for subscription access (not an API key, which is billed separately).
      docs: https://learn.chatgpt.com/docs/auth
    subscription: chatgpt-business
    command_candidates: [codex]
    strengths: [implementation, debugging, testing, repository_work]
    primary_specializations: [debugging_testing]
    preferred_execution_surface: cli
    surfaces:
      ide:
        kind: vscode_extension
        identifiers: [openai.chatgpt]
        interactive: true
        machine_execution: false
        requires_local_client: false
      cli:
        kind: cli
        commands: [codex]
        interactive: true
        machine_execution: true
        requires_local_client: true
        workstation_smoke_required: true
      mcp:
        kind: mcp_client
        interactive: true
        machine_execution: false
        requires_local_client: false
    native_capabilities: [skills, plugins, mcp, permissions, sessions, ide_context, repository_execution]
    safety:
      read_mode: sandbox-read-only-approval-never
      modify_mode: sandbox-workspace-write-approval-never-plus-worktree
      workstation_smoke_required: true
      note: Managed/user Codex configuration can alter effective sandbox behavior; smoke validation is required on the installed version and OS.

  kiro:
    provider: aws
    auth_boundary: kiro-cli
    sign_in:
      command: [kiro-cli, login]
      instructions: Sign in through Kiro's official browser or device flow.
      docs: https://kiro.dev/docs/getting-started/authentication/
    subscription: kiro-pro
    command_candidates: [kiro-cli]
    strengths: [specification, requirements, design_planning, implementation_planning, aws_specialization, kiro_native_workflows]
    primary_specializations: [specification_planning, aws]
    preferred_execution_surface: acp
    surfaces:
      acp:
        kind: acp
        command: kiro-cli
        args: [acp]
        interactive: false
        machine_execution: true
        requires_local_client: true
        workstation_smoke_required: true
      cli:
        kind: cli
        commands: [kiro-cli]
        interactive: true
        machine_execution: false
        requires_local_client: true
      mcp:
        kind: mcp_client
        interactive: true
        machine_execution: false
        requires_local_client: false
    native_capabilities: [specs, steering, powers, custom_agents, subagents, skills, hooks, mcp, permissions, sessions]
    safety:
      read_mode: acp-read-authority-to-validate
      modify_mode: acp-isolated-worktree-authority-to-validate
      workstation_smoke_required: true
      note: Unattended Kiro execution remains fail-closed until current ACP, subscription-policy, and read/modify authority behavior is validated on the installed version.

  antigravity:
    provider: google
    auth_boundary: antigravity-cli
    sign_in:
      instructions: Sign in inside Google Antigravity itself; Code Conductor never handles Google credentials.
    subscription: google-ai-pro
    command_candidates: [agy]
    strengths: [google_native_agent_work, gcp_specialization, independent_implementation, independent_review]
    primary_specializations: [gcp]
    preferred_execution_surface: ide
    surfaces:
      ide:
        kind: ide
        interactive: true
        machine_execution: false
        requires_local_client: true
      cli:
        kind: cli
        commands: [agy]
        interactive: true
        machine_execution: false
        requires_local_client: true
        workstation_smoke_required: true
    native_capabilities: [google_native_agent_work, gcp_context, independent_review]
    safety:
      headless_execution_enabled: false
      reason: Unattended execution remains blocked until ADR 0004 is revalidated against the installed current release and safe read/modify authority boundaries are demonstrated.

  perplexity:
    provider: perplexity
    auth_boundary: perplexity-pro-client
    sign_in:
      instructions: Sign in to Perplexity in its own app or browser; research handoffs stay manual.
    subscription: perplexity-pro
    strengths: [web_research, source_discovery, research_synthesis]
    primary_specializations: [external_research]
    preferred_execution_surface: manual
    surfaces:
      manual:
        kind: manual
        interactive: true
        machine_execution: false
        requires_local_client: false
      mcp_api:
        kind: mcp_api
        interactive: false
        machine_execution: true
        requires_local_client: false
        separately_billed_api: true
        enabled_by_default: false
    native_capabilities: [web_research, source_discovery, research_synthesis]
    automation_modes:
      subscription_manual:
        separately_billed_api: false
      official_mcp_api:
        separately_billed_api: true
        enabled_by_default: false

  internal-validator:
    provider: code-conductor
    auth_boundary: local-process
    subscription: none
    command_candidates: []
    strengths: [deterministic_validation]
    primary_specializations: []
    preferred_execution_surface: local
    surfaces:
      local:
        kind: local
        interactive: false
        machine_execution: true
        requires_local_client: false
    native_capabilities: [deterministic_validation]

routing_invariants:
  - prefer_unique_platform_advantage
  - prefer_explicit_task_specialization_over_inferred_objective_signal
  - prefer_subscription_backed_lane
  - do_not_route_by_vendor_brand_alone
  - preserve_provider_native_capabilities
  - mediate_cross_provider_ai_invocation_through_conductor
  - keep_harness_specific_behavior_out_of_core
  - require_independent_review_for_r2_or_higher
  - require_human_approval_for_r3_or_higher
  - require_surface_specific_workstation_smoke_before_external_unattended_execution
